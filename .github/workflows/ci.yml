name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node:22-alpine in web/Dockerfile and api/Dockerfile — CI must match production.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      # Every locale must carry the same key set, or a missing key falls back to
      # English mid-sentence with nothing failing anywhere.
      - name: Check locales are in sync
        run: node scripts/check-locales.mjs
        working-directory: frontend
      # check-locales compares the packs to each other, so a key missing from ALL of them is
      # invisible to it. This walks src/ instead. Report-only for now: there is a known
      # backlog of untranslated demo-view strings to clear before it can fail the build.
      - run: node scripts/check-source-strings.mjs
        working-directory: frontend
      # The fatigue model must never read higher after a rest day than before it.
      # Property probe over ~108k comparisons; too slow for the unit suite, cheap here.
      - run: npm run test:fatigue-probe
        working-directory: frontend

  mcp:
    name: MCP server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp
      # The one check the vitest suite structurally cannot make. The MCP server is a bare node
      # process, but vitest runs its tests through Vite — import.meta.glob, .jsx imports and
      # ?raw all resolve happily there. That is how a Vite-only import reached a shared lib
      # module with 33 green tests standing over a server that died on startup.
      - run: npm run check:node-loadable
        working-directory: mcp

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The API has no dev dependencies and its suite is node:test — `npm ci` would only
      # fetch the two runtime deps the tests do not touch, so there is nothing to install.
      - run: npm test
        working-directory: api

  images:
    name: Images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Guards the break this CI was added after: docker-compose.yml pointing at a
      # Dockerfile that had been moved. Build both images the way compose does.
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
