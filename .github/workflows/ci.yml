name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # matches web/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # Every locale must carry the same key set, or a missing key falls back to
      # English mid-sentence with nothing failing anywhere.
      - name: Check locales are in sync
        run: node scripts/check-locales.mjs
        working-directory: frontend

  images:
    name: Images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Guards the break this CI was added after: docker-compose.yml pointing at a
      # Dockerfile that had been moved. Build both images the way compose does.
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
