name: Publish images

# Publishes the two containers to GHCR so self-hosters can pull instead of build.
# Deliberately not on every push: it runs when you cut a release, or by hand.
#
# Once these have run at least once, docker-compose.yml can carry `image:` lines again
# alongside `build:`. Note that Actions creates GHCR packages as PRIVATE: after the first
# successful run, make both public under the repo's Packages settings, or `docker compose
# pull` will fail with "denied" for everyone else.

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: opengym-api
            context: ./api
            file: ./api/Dockerfile
          - name: opengym-web
            context: .
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # On a release the ref is a tag, so the semver patterns fill in. On a manual
          # run they match nothing, which is why latest and the short sha are
          # unconditional — otherwise the push would have no tag at all and fail.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
